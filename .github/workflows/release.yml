name: Release PDF

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer pango
        run: brew install pango

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le PDF
        run: ./outils/build.sh

      - name: Nommer le PDF avec la version
        run: mv build/le-sprint-d-apres.pdf "build/le-sprint-d-apres-${GITHUB_REF_NAME}.pdf"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: build/le-sprint-d-apres-${{ github.ref_name }}.pdf
          generate_release_notes: true
